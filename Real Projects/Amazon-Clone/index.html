<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Amazon Clone Project">
    <title>Amazon-Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png.png">
</head>
<body> 
    <!--------------------Header-------------------->
    <header>
       <div class="navbar">

        <!---------Logo-------------->
        <div class="nav-logo border">
            <div class="logo">
        </div>
        </div> 

        <!---------Location-------------->
        <div class="nav-address border">
            <p class="add-first">Deliver to</p>
            <div class="add-icon">
            <i class="fa-solid fa-location-dot"></i>
            <p class="add-second">Pakistan</p>
            </div>
        </div>
        
        <!---------Search Bar-------------->
        <div class="nav-search">
         <select class="nav-select">
            <option value="all">All</option>
            <option value="books">Books</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing</option>
            <option value="home">Home & Kitchen</option>
         </select>
            <input type="text" class="nav-input" placeholder="Search Amazon">
            <div class="nav-icon">
               <button class="nav-search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
        
        <!---------Language-------------->
        <div class="nav-language border">
        <div class="flg-pic"></div>
          <span class="dropdown-icon">EN▼</span>
        </div>

        <!---------Account-------------->
        <div class="nav-account border">
            <p class="account-first">Hello, Sign in</p>
            <div class="account-second">
                <p >Account & Lists▼</p>
            </div>
        </div>   
        
        <!---------Orders-------------->
        <div class="nav-orders border">
            <p class="orders-first">Returns</p>
            <div class="orders-second">
                <p>& Orders</p>
            </div>
        </div>
        
        <!---------Cart-------------->
        <div class="nav-cart border">
          <i class="fa-solid fa-cart-shopping"></i>
          <div><p class="cart-text">Cart</p>
          </div> 
        </div>

        </div>       
        </nav> 
        
        <!-- ==============Navbar Ends=================   -->
       
        
         <!-- ==============Panel=================   -->

        <div class="panel">
            <div class="panel-all">
            <i class="fa-solid fa-bars"></i>
                  All
            </div>      
            <div class="panel-ops">
            <p>Today's Deals</p>
            <p>Gift Cards</p>
            <p>Sell</p>
            <p>Register</p>
            <p>Prime Video</p>
            <p>Customer Service</p>
        </div>
        </div>
    </header>     
    
    <!-- ===============================Main Section==================== -->
    <main>
    
        <div class="hero-section"></div>

</body>
</html>
