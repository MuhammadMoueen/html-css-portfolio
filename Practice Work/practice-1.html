<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practice work for HTML">
    <title>Practice Work</title>
    <link rel="stylesheet" href="style.css">
    <style>
        button{
            color: blue;
        }
    </style>
</head>
<body>
    <!-- Q1:
Create a simple div with an id "box".
Add some text content inside the div.
Set its background color to blue. -->

<div id="box">
<h1>Muhammad is my hero.</h1>
<p>He is the prophet of Allah.</p>
</div>
        <!-- Q2:
            Create 3 headings using h1, h2, and h3.
            Give all of them a class "heading" and set the color of this class to red. -->

<h1 class="heading">Heading 1</h1>
<h2 class="heading">Heading 2</h2>
<h3 class="heading">Heading 3</h3>

<!-- Create a button and set its background color using three different methods:

Green using external CSS stylesheet
Blue using <style> tag (internal CSS)
Pink using inline CSS -->

<button style="color: pink;">Click me!</button>
</body>
</html>
